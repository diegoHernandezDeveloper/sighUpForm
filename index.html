<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>

        <div class="logoHolder">
            <img src="img/logo.png" alt="odin logo" height="150px">
            <span>ODIN</span>
        </div>
    </header>
    <main>

        <p>This is not a real online service! You know you need something like this in your life to help you realize your depest dreams. Sign up now to get started.</p>
        <p>You know you want to.</p>

        <form action="">
            <h2 class="formh2">Let's do this!</h2>
            <div class="inputsHolder">
                <div>
                    <label for="firstName">FIRST NAME</label>
                    <input type="text" name="firstName" id="firstName">
                </div>
                <div>
                    <label for="lastName">LAST NAME</label>
                    <input type="text" name="lastName" id="lastName">
                </div>
                 <div>
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                </div>
                 <div>
                    <label for="phoneNumber">PHONE NUMBER</label>
                    <input type="text" name="phoneNumber" id="phoneNumber">
                </div>
                <div>
                    <label for="passwordOne">PASSWORD</label>
                    <input type="password" name="passwordOne" id="passwordOne" minlength="6">
                </div>
                <div>
                    <label for="passwordTwo">CONFIRM PASSWORD</label>
                    <input type="password" name="passwordTwo" id="passwordTwo" minlength="6">
                </div>
            </div>
        </form>

        <button>Create account</button>

        <p class="finalP">Already have an account? <a href="#">Log in</a></p>
    </main>

    <script src="main.js"></script>
</body>
</html>
